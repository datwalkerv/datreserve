version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datreserve-postgres
    environment:
      POSTGRES_USER: datreserve
      POSTGRES_PASSWORD: datreserve
      POSTGRES_DB: datreserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
